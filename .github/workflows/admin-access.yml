name: Grant AUVYQORA Admin Access

on:
  workflow_dispatch:
    inputs:
      admin_email:
        description: "Email address of the verified owner account already registered in AUVYQORA"
        required: true
        type: string
      operation:
        description: "Grant or revoke owner admin access"
        required: true
        type: choice
        options:
          - grant
          - revoke
        default: grant

permissions:
  contents: read

jobs:
  update-admin-claim:
    if: github.ref == 'refs/heads/feature/auvyqora-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase Admin SDK
        run: npm install --no-save firebase-admin

      - name: Update verified owner's custom claim
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.AUVYQORA_ADMIN_SERVICE_ACCOUNT_JSON }}
          ADMIN_EMAIL: ${{ inputs.admin_email }}
          OPERATION: ${{ inputs.operation }}
        run: |
          node --input-type=module <<'NODE'
          import { initializeApp, cert } from 'firebase-admin/app';
          import { getAuth } from 'firebase-admin/auth';

          const expectedProject = 'auvyqora-c2d3a';
          const serviceAccountText = process.env.FIREBASE_SERVICE_ACCOUNT_JSON;
          if (!serviceAccountText) {
            throw new Error('Missing GitHub secret AUVYQORA_ADMIN_SERVICE_ACCOUNT_JSON.');
          }

          const serviceAccount = JSON.parse(serviceAccountText);
          if (serviceAccount.project_id !== expectedProject) {
            throw new Error('Service account project does not match the AUVYQORA Firebase project.');
          }

          const email = (process.env.ADMIN_EMAIL || '').trim().toLowerCase();
          if (!email || !email.includes('@')) {
            throw new Error('Enter a valid owner email address.');
          }

          const operation = process.env.OPERATION;
          if (!['grant', 'revoke'].includes(operation)) {
            throw new Error('Unsupported operation.');
          }

          const app = initializeApp({
            credential: cert(serviceAccount),
            projectId: expectedProject,
          });
          const auth = getAuth(app);
          const user = await auth.getUserByEmail(email);

          if (!user.emailVerified) {
            throw new Error('The account email must be verified before admin access can be granted.');
          }

          const claims = { ...(user.customClaims || {}) };
          if (operation === 'grant') {
            claims.admin = true;
          } else {
            delete claims.admin;
            if (claims.role === 'admin') delete claims.role;
          }

          await auth.setCustomUserClaims(user.uid, claims);
          console.log(operation === 'grant'
            ? 'Verified owner admin access was granted.'
            : 'Owner admin access was revoked.');
          NODE
