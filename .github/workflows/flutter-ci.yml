name: Flutter CI
on:
  push:
    branches: ['fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: auvyqora-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      FIREBASE_CONFIG: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Generate Android platform scaffold
        run: flutter create . --platforms=android --org com.auvyqora
      - name: Configure Google Mobile Ads test app ID
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          marker = '<application'
          metadata = '        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>'
          if 'com.google.android.gms.ads.APPLICATION_ID' not in content:
              start = content.find(marker)
              if start < 0:
                  raise SystemExit("Android application manifest section was not found.")
              end = content.find('>', start)
              if end < 0:
                  raise SystemExit("Android application tag is malformed.")
              content = content[:end + 1] + "\n" + metadata + content[end + 1:]
              manifest.write_text(content)
          print("Configured Google's sample AdMob app ID for test ads only.")
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze viewer app only
        run: flutter analyze lib test
      - name: Widget tests
        run: flutter test
      - name: Configure Firebase for Android build
        if: env.FIREBASE_CONFIG != ''
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config_text = os.environ["FIREBASE_CONFIG"]
          config = json.loads(config_text)
          project_id = config.get("project_info", {}).get("project_id")
          if project_id != "auvyqora-c2d3a":
              raise SystemExit("Firebase project mismatch. Expected auvyqora-c2d3a; found " + str(project_id))
          app_id = "com.auvyqora.auvyqora"
          clients = config.get("client", [])
          package_names = [
              client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for client in clients
          ]
          if app_id not in package_names:
              raise SystemExit(
                  "Firebase package mismatch. Expected "
                  + app_id
                  + "; found "
                  + ", ".join(name for name in package_names if name)
              )

          gradle = Path("android/app/build.gradle.kts")
          settings = Path("android/settings.gradle.kts")
          gradle_text = gradle.read_text()
          settings_text = settings.read_text()
          if 'applicationId = "com.auvyqora.auvyqora"' not in gradle_text:
              raise SystemExit("Generated Android applicationId does not match the expected Firebase package.")

          if 'id("com.google.gms.google-services") version "4.4.4" apply false' not in settings_text:
              settings_text = settings_text.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services") version "4.4.4" apply false',
                  1,
              )
          if 'id("com.google.gms.google-services")' not in gradle_text:
              gradle_text = gradle_text.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services")',
                  1,
              )
          gradle_text = gradle_text.replace(
              "minSdk = flutter.minSdkVersion",
              "minSdk = 24",
          )
          gradle.write_text(gradle_text)
          settings.write_text(settings_text)
          config_path = Path("android/app/google-services.json")
          config_path.write_text(config_text)
          print("Firebase Android configuration validated and installed for this build.")
          PY
      - name: Build debug APK
        if: env.FIREBASE_CONFIG != ''
        run: flutter build apk --debug
      - name: Upload debug APK
        if: env.FIREBASE_CONFIG != ''
        uses: actions/upload-artifact@v4
        with:
          name: auvyqora-firebase-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - name: Explain skipped Firebase build
        if: env.FIREBASE_CONFIG == ''
        run: echo "Firebase build skipped because FIREBASE_ANDROID_GOOGLE_SERVICES_JSON is not configured."

  admin_validate:
    runs-on: ubuntu-latest
    env:
      ADMIN_FIREBASE_CONFIG: ${{ secrets.FIREBASE_ADMIN_GOOGLE_SERVICES_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Generate separate admin Android app
        run: flutter create admin_app --project-name admin --platforms=android --org com.auvyqora
      - name: Install admin dependencies
        working-directory: admin_app
        run: flutter pub get
      - name: Analyze admin app
        working-directory: admin_app
        run: flutter analyze
      - name: Test admin app
        working-directory: admin_app
        run: flutter test
      - name: Configure Firebase for admin APK
        if: env.ADMIN_FIREBASE_CONFIG != ''
        working-directory: admin_app
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config_text = os.environ["ADMIN_FIREBASE_CONFIG"]
          config = json.loads(config_text)
          project_id = config.get("project_info", {}).get("project_id")
          if project_id != "auvyqora-c2d3a":
              raise SystemExit("Admin Firebase project mismatch. Expected auvyqora-c2d3a; found " + str(project_id))
          app_id = "com.auvyqora.admin"
          package_names = [
              client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for client in config.get("client", [])
          ]
          if app_id not in package_names:
              raise SystemExit("Firebase admin package mismatch; expected " + app_id)

          gradle = Path("android/app/build.gradle.kts")
          settings = Path("android/settings.gradle.kts")
          gradle_text = gradle.read_text()
          settings_text = settings.read_text()
          if 'applicationId = "com.auvyqora.admin"' not in gradle_text:
              raise SystemExit("Generated admin applicationId mismatch.")
          if 'id("com.google.gms.google-services") version "4.4.4" apply false' not in settings_text:
              settings_text = settings_text.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services") version "4.4.4" apply false',
                  1,
              )
          if 'id("com.google.gms.google-services")' not in gradle_text:
              gradle_text = gradle_text.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services")',
                  1,
              )
          gradle_text = gradle_text.replace("minSdk = flutter.minSdkVersion", "minSdk = 24")
          gradle.write_text(gradle_text)
          settings.write_text(settings_text)
          Path("android/app/google-services.json").write_text(config_text)
          print("Admin Firebase configuration validated.")
          PY
      - name: Build admin debug APK
        if: env.ADMIN_FIREBASE_CONFIG != ''
        working-directory: admin_app
        run: flutter build apk --debug
      - name: Upload admin debug APK
        if: env.ADMIN_FIREBASE_CONFIG != ''
        uses: actions/upload-artifact@v4
        with:
          name: auvyqora-admin-debug-apk
          path: admin_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - name: Explain skipped admin APK build
        if: env.ADMIN_FIREBASE_CONFIG == ''
        run: echo "Admin APK build skipped; add FIREBASE_ADMIN_GOOGLE_SERVICES_JSON after registering the admin Android app in Firebase."

  functions_validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        working-directory: functions
        run: npm install
      - name: Check backend syntax
        working-directory: functions
        run: npm run check

  rules_validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: rules_tests/package-lock.json
      - name: Install rules test dependencies
        working-directory: rules_tests
        run: npm install
      - name: Run Firestore and Storage Rules tests in emulators
        run: npx --yes firebase-tools@14.19.0 emulators:exec --project demo-auvyqora --only firestore,storage "npm --prefix rules_tests test"
